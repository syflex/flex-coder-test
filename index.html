<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Coder Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Awesome Todo List</h1>

        <div class="todo-input-section">
            <input type="text" id="todo-input" placeholder="Add a new todo item..." aria-label="New todo item text">
            <select id="todo-category" aria-label="Todo category">
                <option value="Work">Work</option>
                <option value="Food">Food</option>
            </select>
            <button id="add-todo-btn">Add Todo</button>
        </div>

        <ul id="todo-list">
            <!-- Todo items will be rendered here by script.js -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
