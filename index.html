<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Coder Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>My Todo List</h1>

        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Add a new todo item..." required aria-label="New todo text">
            <button type="submit" id="add-todo-button">Add Todo</button>
        </form>

        <ul id="todo-list">
            <!-- Todo items will be rendered here by JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
