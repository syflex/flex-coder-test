<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Coder Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Todo List</h1>

        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Add a new todo item..." aria-label="New todo item">
            <button id="addTodoButton">Add Todo</button>
        </div>

        <ul id="todoList" aria-live="polite">
            <!-- Todo items will be added here -->
        </ul>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
