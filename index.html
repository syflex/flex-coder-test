<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Coder Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Todo List</h1>
    </header>

    <main>
        <section class="todo-input-section">
            <input type="text" id="new-todo-input" placeholder="Add a new todo item...">
            <button id="add-todo-button">Add Todo</button>
        </section>

        <section class="todo-list-section">
            <ul id="todo-list">
                <!-- Todo items will be rendered here by script.js -->
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
